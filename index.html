<style>
:root{
  --brand:#0f4c81; --brand2:#1769aa; --brand-d:#0b3a63;
  --bg:#f4f6fa; --card:#ffffff; --ink:#1f2733; --muted:#6b7686; --line:#e4e8ef;
  --ok:#1a9d5a; --okbg:#e7f6ee; --warn:#c8860a; --warnbg:#fdf3e0; --crit:#d13c3c; --critbg:#fdeaea;
  --hi:#e06a1c; --hibg:#fceee2; --info:#2f6fbf; --infobg:#e9f1fb;
  --radius:12px; --sh:0 1px 3px rgba(20,40,80,.08),0 1px 2px rgba(20,40,80,.06);
  --sh2:0 6px 24px rgba(20,40,80,.14);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:15px}
a{color:var(--brand2);text-decoration:none}
.hidden{display:none!important}

/* ---------- LOGIN ---------- */
#login{position:fixed;inset:0;background:linear-gradient(135deg,#0f4c81,#123a5c 60%,#0b2a44);display:flex;align-items:center;justify-content:center;padding:20px;z-index:60}
.login-card{background:#fff;border-radius:16px;box-shadow:var(--sh2);width:100%;max-width:380px;padding:28px}
.login-card h1{margin:0 0 2px;font-size:22px;color:var(--brand)}
.login-card .sub{color:var(--muted);font-size:13px;margin-bottom:20px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}
.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand2);box-shadow:0 0 0 3px rgba(23,105,170,.12)}
.btn{border:none;border-radius:9px;padding:11px 16px;font-weight:600;background:var(--brand);color:#fff;font-size:15px;display:inline-flex;align-items:center;gap:7px;justify-content:center}
.btn:hover{background:var(--brand-d)}
.btn.block{width:100%}
.btn.sec{background:#eef2f7;color:var(--ink)}.btn.sec:hover{background:#e2e8f1}
.btn.ghost{background:transparent;color:var(--brand2);border:1px solid var(--line)}
.btn.danger{background:var(--crit)}.btn.danger:hover{background:#a92f2f}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.xs{padding:4px 8px;font-size:12px;border-radius:7px}
.demo-creds{margin-top:16px;font-size:12px;color:var(--muted);background:#f6f8fb;border:1px dashed var(--line);border-radius:9px;padding:10px 12px}
.demo-creds b{color:var(--ink)}

/* ---------- APP FRAME ---------- */
#app{display:none;min-height:100%}
.topbar{position:sticky;top:0;z-index:30;background:var(--brand);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px;box-shadow:var(--sh)}
.topbar .menu-btn{background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:8px;width:38px;height:38px;font-size:19px;display:none;align-items:center;justify-content:center}
.topbar .logo{font-weight:800;letter-spacing:.3px;font-size:17px;display:flex;align-items:center;gap:8px}
.topbar .logo .dot{width:10px;height:10px;border-radius:3px;background:#7fd3a5;box-shadow:0 0 0 3px rgba(127,211,165,.3)}
.topbar .gsearch{flex:1;max-width:440px;position:relative}
.topbar .gsearch input{width:100%;padding:9px 12px 9px 34px;border-radius:9px;border:none;background:rgba(255,255,255,.16);color:#fff;outline:none}
.topbar .gsearch input::placeholder{color:rgba(255,255,255,.75)}
.topbar .gsearch svg{position:absolute;left:10px;top:9px;opacity:.8}
.topbar .spacer{flex:1}
.net{font-size:12px;padding:4px 9px;border-radius:20px;display:flex;align-items:center;gap:5px;font-weight:600}
.net .d{width:8px;height:8px;border-radius:50%}
.net.on{background:rgba(127,211,165,.2)}.net.on .d{background:#7fd3a5}
.net.off{background:rgba(255,180,120,.25)}.net.off .d{background:#ffb478}
.bell{position:relative;background:rgba(255,255,255,.15);border:none;color:#fff;width:38px;height:38px;border-radius:9px;font-size:17px}
.bell .badge{position:absolute;top:-4px;right:-4px;background:var(--crit);color:#fff;border-radius:10px;font-size:10px;min-width:17px;height:17px;line-height:17px;text-align:center;padding:0 3px;font-weight:700}
.userchip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);padding:5px 10px;border-radius:22px;font-size:13px}
.userchip .av{width:26px;height:26px;border-radius:50%;background:#fff;color:var(--brand);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:12px}

.frame{display:flex;align-items:stretch}
.side{width:230px;flex:none;background:#0d2a44;color:#cdd8e6;min-height:calc(100vh - 58px);padding:12px 10px;position:sticky;top:58px;overflow:auto}
.side .grp{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#6f89a6;margin:14px 10px 6px}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;color:#cdd8e6;font-weight:500;font-size:14.5px;margin-bottom:2px}
.nav a .ic{width:20px;text-align:center;opacity:.9}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a.active{background:var(--brand2);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.nav a .cnt{margin-left:auto;background:rgba(255,255,255,.14);border-radius:10px;font-size:11px;padding:1px 7px}
.nav a.active .cnt{background:rgba(255,255,255,.25)}
.scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:24}

.main{flex:1;min-width:0;padding:18px 20px 90px}
.page-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.page-head h2{margin:0;font-size:20px}
.page-head .sub{color:var(--muted);font-size:13px}
.page-head .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

/* ---------- CARDS / GRID ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--sh);cursor:pointer;transition:.12s}
.stat:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.stat .lbl{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.stat .val{font-size:26px;font-weight:800;margin-top:4px}
.stat .foot{font-size:11.5px;color:var(--muted);margin-top:3px}
.stat.b-crit{border-left:4px solid var(--crit)} .stat.b-hi{border-left:4px solid var(--hi)}
.stat.b-warn{border-left:4px solid var(--warn)} .stat.b-info{border-left:4px solid var(--info)}
.stat.b-ok{border-left:4px solid var(--ok)} .stat.b-brand{border-left:4px solid var(--brand)}

.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--sh);margin-bottom:16px;overflow:hidden}
.panel .ph{padding:13px 16px;border-bottom:1px solid var(--line);font-weight:700;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.panel .ph .actions{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap}
.panel .pb{padding:14px 16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.chart-box{position:relative;height:260px}

/* ---------- TABLE ---------- */
.tablewrap{overflow:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px;min-width:560px}
table.tbl th{position:sticky;top:0;background:#f7f9fc;text-align:left;padding:10px 12px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap}
table.tbl th .ar{opacity:.5;font-size:10px}
table.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
table.tbl tr:hover td{background:#fafcff}
table.tbl tr.clk{cursor:pointer}
.empty{text-align:center;color:var(--muted);padding:34px 16px}
.empty .ico{font-size:34px;opacity:.4}

/* ---------- BADGES ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
.bg-ok{background:var(--okbg);color:var(--ok)} .bg-warn{background:var(--warnbg);color:var(--warn)}
.bg-crit{background:var(--critbg);color:var(--crit)} .bg-hi{background:var(--hibg);color:var(--hi)}
.bg-info{background:var(--infobg);color:var(--info)} .bg-mut{background:#eef1f5;color:var(--muted)}
.bg-brand{background:#e7eefb;color:var(--brand)}

/* ---------- FILTERS ---------- */
.filters{display:flex;gap:9px;flex-wrap:wrap;align-items:end}
.filters .f{display:flex;flex-direction:column;gap:4px}
.filters label{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase}
.filters input,.filters select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;min-width:130px;background:#fff}

/* ---------- MODAL ---------- */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(15,30,55,.5);z-index:50;align-items:flex-start;justify-content:center;padding:24px 14px;overflow:auto}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:14px;box-shadow:var(--sh2);width:100%;max-width:640px;animation:pop .15s ease}
.modal.wide{max-width:900px}
@keyframes pop{from{transform:translateY(8px);opacity:.6}to{transform:none;opacity:1}}
.modal .mh{display:flex;align-items:center;padding:15px 18px;border-bottom:1px solid var(--line)}
.modal .mh h3{margin:0;font-size:17px}
.modal .mh .x{margin-left:auto;background:#f1f4f8;border:none;width:32px;height:32px;border-radius:8px;font-size:17px;color:var(--muted)}
.modal .mb{padding:18px}
.modal .mf{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.form-grid .full{grid-column:1/-1}
.hint{font-size:11.5px;color:var(--muted);margin-top:3px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:#eef2f7;border:1px solid var(--line);border-radius:20px;padding:4px 10px;font-size:12.5px;display:flex;align-items:center;gap:6px}
.chip b{font-weight:700}
.chip .rm{cursor:pointer;color:var(--crit);font-weight:800}

/* ---------- C360 ---------- */
.c360-head{background:linear-gradient(120deg,var(--brand),var(--brand2));color:#fff;border-radius:var(--radius);padding:18px 20px;margin-bottom:16px;box-shadow:var(--sh)}
.c360-head h2{margin:0 0 3px;font-size:22px}
.c360-head .meta{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;opacity:.95;margin-top:8px}
.c360-head .meta span{display:flex;align-items:center;gap:6px}
.tabbar{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px;border-bottom:1px solid var(--line)}
.tabbar button{background:none;border:none;padding:9px 13px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;font-size:14px}
.tabbar button.active{color:var(--brand);border-bottom-color:var(--brand)}
.timeline .ti{border-left:2px solid var(--line);padding:2px 0 14px 16px;position:relative}
.timeline .ti:before{content:"";position:absolute;left:-6px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--brand2)}
.timeline .ti .dt{font-size:12px;color:var(--muted)}

/* ---------- FAB / TOAST ---------- */
.fab{position:fixed;right:20px;bottom:20px;z-index:35;background:var(--ok);color:#fff;border:none;border-radius:30px;padding:14px 20px;font-weight:800;font-size:15px;box-shadow:0 8px 22px rgba(26,157,90,.45);display:flex;align-items:center;gap:9px}
.fab:hover{background:#15864c}
#toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:#12263f;color:#fff;padding:11px 16px;border-radius:10px;box-shadow:var(--sh2);font-size:14px;display:flex;align-items:center;gap:9px;animation:pop .15s;max-width:90vw}
.toast.ok{background:#15864c}.toast.err{background:#b1332f}.toast.warn{background:#b57a10}
.notif-pop{position:fixed;top:56px;right:12px;width:340px;max-width:92vw;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh2);z-index:45;display:none;max-height:70vh;overflow:auto}
.notif-pop.open{display:block}
.notif-pop .nh{padding:12px 14px;border-bottom:1px solid var(--line);font-weight:700;display:flex;align-items:center}
.notif-item{padding:11px 14px;border-bottom:1px solid var(--line);font-size:13px;display:flex;gap:9px}
.notif-item.unread{background:#f0f6ff}
.notif-item .ic{font-size:16px}

.two-col{display:grid;grid-template-columns:1fr 1fr;gap:8px 20px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
.kv .k{color:var(--muted)}
.kv .v{font-weight:600;text-align:right}
.req:after{content:" *";color:var(--crit)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.small{font-size:12.5px;color:var(--muted)}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{flex:1;border:none;background:#fff;padding:9px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--brand);color:#fff}
.map-preview{background:#eef2f7;border:1px dashed var(--line);border-radius:9px;padding:10px;font-size:13px;color:var(--muted)}

/* ---------- RESPONSIVE ---------- */
@media(max-width:920px){ .grid2{grid-template-columns:1fr} }
@media(max-width:780px){
  .side{position:fixed;left:0;top:0;height:100vh;z-index:25;transform:translateX(-100%);transition:.2s;box-shadow:var(--sh2)}
  .side.open{transform:none}
  .scrim.open{display:block}
  .topbar .menu-btn{display:flex}
  .topbar .gsearch{display:none}
  .userchip .nm{display:none}
  .main{padding:14px 12px 96px}
  .form-grid{grid-template-columns:1fr}
  .two-col{grid-template-columns:1fr}
  .page-head .actions{width:100%}
  .cards{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
}
</style>
</head>

<!-- LOGIN -->
<div id="login">

    <h1>🛗 Shakti Elevator</h1>
    <div class="sub">Visit • Inquiry • AMC Management</div>
    <div class="field"><label>Email</label><input id="lg-user" type="email" autocomplete="username" placeholder="you@shaktielevator.com"></div>

    <button class="btn block" id="lg-btn">Sign in</button>
    <div style="text-align:center;margin-top:10px"><a href="#" id="lg-forgot" class="small">Forgot password?</a></div>
    <div id="lg-err" class="small" style="color:var(--crit);margin-top:8px;text-align:center"></div>
    <div class="demo-creds" id="cfgWarn" style="display:none;border-color:var(--crit);background:var(--critbg);color:var(--crit)">
      <b>Firebase not configured.</b> Open this file and paste your project config into <code>window.FIREBASE_CONFIG</code> near the top, then reload. See the SETUP guide.
    </div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="topbar">
    <button class="menu-btn" id="menuBtn">☰</button>
    <div class="logo"><span class="dot"></span>Shakti Elevator</div>
    <div class="gsearch">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="globalSearch" placeholder="Search customer, phone, AMC ID, inquiry, serial…">
    </div>
    <div class="spacer"></div>
    <div class="net on" id="netChip"><span class="d"></span><span id="netTxt">Online</span></div>

    <button class="bell" id="logoutBtn" title="Sign out">⏻</button>
  </div>

  <div class="frame">
    <div class="scrim" id="scrim"></div>
    <aside class="side" id="side">
      <nav class="nav" id="nav"></nav>
    </aside>
    <main class="main" id="view"></main>
  </div>

  <button class="fab" id="fab">＋ New Visit</button>
</div>

<div class="notif-pop" id="notifPop">
  <div class="nh">Notifications <button class="btn xs sec" id="markAll" style="margin-left:auto">Mark all read</button></div>
  <div id="notifList"></div>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>

<script>
/* ============================================================================
   Shakti Elevator  —  single-file field CRM for lift Visit / Inquiry / AMC
   DATA LAYER:  everything persists through `store`, a set of relational
   "tables" cached in memory and written through to Firestore (cloud).
   Reads are synchronous against the cache; writes update the cache and
   persist each document to Firestore. Auth is Firebase Authentication.
============================================================================ */
(function(){
'use strict';

/* ---------- tiny utils ---------- */
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const el = (t,a={},...kids)=>{const n=document.createElement(t);
  for(const k in a){ if(k==='class')n.className=a[k]; else if(k==='html')n.innerHTML=a[k];
    else if(k.startsWith('on'))n.addEventListener(k.slice(2),a[k]); else if(a[k]!=null)n.setAttribute(k,a[k]); }
  kids.flat().forEach(c=>n.append(c?.nodeType?c:document.createTextNode(c??''))); return n;};
const esc = s => (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => p+'-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const todayISO = ()=> new Date().toISOString().slice(0,10);
const nowISO   = ()=> new Date().toISOString();
function parseD(s){ if(!s)return null; const d=new Date(s+(s.length<=10?'T00:00:00':'')); return isNaN(d)?null:d; }
function fmtD(s){ const d=parseD(s); if(!d)return '—'; return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
function fmtDT(s){ const d=s?new Date(s):null; if(!d||isNaN(d))return '—'; return d.toLocaleString('en-GB',{day:'2-digit',month:'short',year:'2-digit',hour:'2-digit',minute:'2-digit'}); }
function daysUntil(s){ const d=parseD(s); if(!d)return null; const t=new Date(todayISO()+'T00:00:00'); return Math.round((d-t)/86400000); }
function addDaysISO(s,n){ const d=parseD(s); if(!d)return null; d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function inr(n){ n=Number(n)||0; return '₹'+n.toLocaleString('en-IN'); }
async function sha256(t){ const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
function debounce(fn,ms=250){let h;return(...a)=>{clearTimeout(h);h=setTimeout(()=>fn(...a),ms);};}

function toast(msg,type=''){ const t=el('div',{class:'toast '+type},
  el('span',{},type==='ok'?'✓':type==='err'?'✕':type==='warn'?'⚠':'ℹ'),msg);
  $('#toasts').append(t); setTimeout(()=>{t.style.opacity='0';t.style.transition='.3s';setTimeout(()=>t.remove(),300);},2600); }

/* ============================================================================
   STORE  (relational tables over localStorage)  — the swappable seam
============================================================================ */
const TABLES=['users','customers','contacts','visits','inquiries','followups',
              'equipment','amc','alerts','notifications','documents','complaints','audit'];
// Collections a customer may load, each filtered to their own customerId:
const CUST_TABLES=['complaints','amc','equipment','contacts','visits','inquiries','followups'];
let DB=null;            // in-memory cache — same shape the whole app already expects
let fdb=null;           // Firestore instance (set in boot)

/* Firestore rejects `undefined`; strip it (recursively) before every write. */
function clean(o){ if(Array.isArray(o)) return o.map(clean);
  if(o&&typeof o==='object'){ const r={}; for(const k in o){ if(o[k]!==undefined) r[k]=clean(o[k]); } return r; }
  return o; }
function fsErr(e){ console.error('Firestore write failed',e); toast('Cloud save failed — check connection','err'); }

/* STORE — reads are synchronous against the cache (DB); writes update the cache
   immediately AND persist to Firestore in the background (write-through).
   This is the whole "swappable seam": the UI/schema never changed. */
const store={
  async load(){                                   // called once, after sign-in
    DB={seq:{}, settings:null}; TABLES.forEach(t=>DB[t]=[]);
    const meta=await fdb.collection('meta').doc('settings').get();
    DB.settings = meta.exists ? mergeSettings(meta.data()) : defaultSettings();
    const seq =await fdb.collection('meta').doc('seq').get();
    DB.seq = seq.exists ? (seq.data()||{}) : {};
    if(session && session.role==='customer'){        // sandboxed: only this customer's own records
      const cid=session.customerId;
      if(cid){
        const cdoc=await fdb.collection('customers').doc(cid).get();
        DB.customers = cdoc.exists ? [{...cdoc.data(), id:cdoc.id}] : [];
        for(const t of CUST_TABLES){
          try{ const snap=await fdb.collection(t).where('customerId','==',cid).get();
            DB[t]=snap.docs.map(d=>({...d.data(), id:d.id})); }catch(e){ DB[t]=[]; }
        }
      }
      return;
    }
    for(const t of TABLES){                          // staff: full collections
      const snap=await fdb.collection(t).get();
      DB[t]=snap.docs.map(d=>({...d.data(), id:d.id}));
    }
  },
  save(){ /* no-op: every write now persists its own document */ },
  all(t){ return DB[t]||[]; },
  get(t,id){ return (DB[t]||[]).find(r=>r.id===id); },
  where(t,fn){ return (DB[t]||[]).filter(fn); },
  seqNext(prefix){ DB.seq[prefix]=(DB.seq[prefix]||0)+1;
    fdb.collection('meta').doc('seq').set(DB.seq).catch(fsErr); return DB.seq[prefix]; },
  code(prefix,pad=4){ return prefix+'-'+String(this.seqNext(prefix)).padStart(pad,'0'); },
  insert(t,obj){ obj.id=obj.id||uid(t); obj._c=nowISO(); (DB[t]=DB[t]||[]).push(obj);
    fdb.collection(t).doc(obj.id).set(clean(obj)).catch(fsErr);
    if(t!=='audit') audit('CREATE',t,obj.id,null,obj.code||obj.name||obj.id); return obj; },
  update(t,id,patch){ const r=this.get(t,id); if(!r)return null; const old={...r};
    Object.assign(r,patch); r._u=nowISO();
    fdb.collection(t).doc(id).set(clean(r)).catch(fsErr);
    if(t!=='audit') audit('UPDATE',t,id,summarizeChange(old,patch),null); return r; },
  remove(t,id){ const r=this.get(t,id); DB[t]=DB[t].filter(x=>x.id!==id);
    fdb.collection(t).doc(id).delete().catch(fsErr);
    if(t!=='audit') audit('DELETE',t,id,r?.code||r?.name||id,null); },
  settings(){ return DB.settings; },
  saveSettings(s){ DB.settings=s; fdb.collection('meta').doc('settings').set(clean(s)).catch(fsErr); },
  export(){ return JSON.stringify(DB,null,2); },

function friendlyAuthErr(e){ const c=(e&&e.code)||'';
  if(c.includes('invalid-cred')||c.includes('wrong-password')||c.includes('user-not-found')) return 'Invalid email or password';
  if(c.includes('too-many-requests')) return 'Too many attempts — please try again shortly';
  if(c.includes('invalid-email')) return 'Enter a valid email address';
  if(c.includes('email-already-in-use')) return 'An account with that email already exists';
  if(c.includes('weak-password')) return 'Password must be at least 6 characters';
  if(c.includes('network')) return 'Network error — check your connection';
  return (e&&e.message)||'Authentication failed'; }

============================================================================ */
function amcStatus(a){
  if(a.manual==='Cancelled')return 'Cancelled';
  const dl=daysUntil(a.endDate);
  if(dl==null)return 'Active';
  if(dl<0)return 'Expired';
  if(a.renewedAt && (Date.now()-new Date(a.renewedAt))/86400000<60 && dl>30)return 'Renewed';
  if(dl<=30)return 'Expiring Soon';
  return 'Active';
}
function amcSeverity(a){ const dl=daysUntil(a.endDate);
  if(a.manual==='Cancelled')return null;
  if(dl==null)return null;
  if(dl<0)return {k:'crit',lbl:'Critical',txt:`Expired ${Math.abs(dl)}d ago`};
  if(dl<=7)return {k:'hi',lbl:'High',txt:`Expires in ${dl}d`};
  if(dl<=30)return {k:'warn',lbl:'Warning',txt:`Expires in ${dl}d`};
  if(dl<=90)return {k:'info',lbl:'Upcoming',txt:`Expires in ${dl}d`};
  return null;
}
/* create alert + in-app notification only once per (amc, milestone) */
function runAlertScan(){
  const s=store.settings(); const created=[];
  store.all('amc').forEach(a=>{
    if(a.manual==='Cancelled'||!a.endDate)return;
    const dl=daysUntil(a.endDate);
    const cust=store.get('customers',a.customerId);
    const milestones=[...s.alertPeriods].map(d=>({key:d+'d',days:d}));
    if(s.alertOverdue && dl<0) milestones.push({key:'overdue',days:-1});
    milestones.forEach(m=>{
      const trigger = m.key==='overdue'? a.endDate : addDaysISO(a.endDate,-m.days);
      const due = m.key==='overdue' ? dl<0 : (daysUntil(trigger)<=0);
      if(!due)return;
      const exists=store.all('alerts').some(al=>al.amcId===a.id&&al.milestone===m.key);
      if(exists)return;
      const al=store.insert('alerts',{id:uid('alt'),code:store.code('ALT'),amcId:a.id,
        customerId:a.customerId, milestone:m.key,
        type: m.key==='overdue'?'AMC Overdue':`${m.days} days before expiry`,
        alertDate:todayISO(), method:'in-app', status:'Generated', by:'system', ts:nowISO()});
      pushNotif({icon: m.key==='overdue'?'🔴':(m.days<=7?'🟠':m.days<=30?'🟡':'🔵'),
        title:`AMC ${m.key==='overdue'?'OVERDUE':'expiry in '+m.days+'d'}`,
        body:`${cust?cust.name:'Customer'} — ${a.equipment||'Elevator'} · expires ${fmtD(a.endDate)}`,
        link:'#c360/'+a.customerId});
      created.push(al);
    });
  });
  return created;
}

    $('#cfgWarn').style.display='block'; $('#login').style.display='flex'; $('#lg-btn').disabled=true; return;
  }
  try{ firebase.initializeApp(cfg); fdb=firebase.firestore(); }
  catch(e){ $('#cfgWarn').style.display='block'; $('#cfgWarn').innerHTML='<b>Firebase failed to start:</b> '+esc(e.message);
    $('#login').style.display='flex'; return; }

  firebase.auth().onAuthStateChanged(async(fbUser)=>{
    if(!fbUser){ session=null; $('#app').style.display='none'; $('#login').style.display='flex'; return; }
    let prof; try{ prof=await loadProfile(fbUser); }
    catch(e){ $('#lg-err').textContent='Could not read your profile — check Firestore security rules.'; return; }
    if(!prof){ $('#lg-err').textContent='This account has no access profile yet. Ask an administrator to add you, or finish first-time setup.';
      await firebase.auth().signOut(); $('#login').style.display='flex'; return; }
    if(prof.status && prof.status!=='Active'){ $('#lg-err').textContent='This account has been disabled.';
      await firebase.auth().signOut(); $('#login').style.display='flex'; return; }
    session={id:prof.uid,uid:prof.uid,email:prof.email,role:prof.role||'viewer',name:prof.name||prof.email,customerId:prof.customerId||''};
    try{ await store.load(); }catch(e){ console.error(e); toast('Could not load data — check Firestore rules','err'); }
    await seedSettingsIfNeeded();
    audit('LOGIN','users',session.id,'signed in',null);
    startRealtimeSync();
    enterApp();
  });
}
async function seedSettingsIfNeeded(){
  try{ const m=await fdb.collection('meta').doc('settings').get();
    if(!m.exists && requireAdmin()) await fdb.collection('meta').doc('settings').set(clean(DB.settings)); }catch{}
}
/* Live multi-user sync: when anyone changes data, every signed-in device updates. */
let syncT=null;
let _seenComplaint=0, _seenConfirm=0;   // for "pop-up" alerts to staff
function startRealtimeSync(){
  if(session && session.role==='customer'){            // customer: only their own complaints & AMCs live-update
    const cid=session.customerId; if(!cid) return;
    ['complaints','amc'].forEach(t=>{
      fdb.collection(t).where('customerId','==',cid).onSnapshot(
        snap=>{ DB[t]=snap.docs.map(d=>({...d.data(),id:d.id})); scheduleSyncRender(); },
        err=>console.warn('sync '+t+':',err.message));
    });
    return;
  }
  // staff: everything live. Seed "last seen" markers so we only alert on genuinely new activity.
  _seenComplaint=Math.max(0,...store.all('complaints').map(c=>Date.parse(c._c)||0));
  _seenConfirm  =Math.max(0,...store.all('amc').map(a=>Date.parse(a.custConfirmedAt)||0));
  TABLES.filter(t=>t!=='audit').forEach(t=>{
    fdb.collection(t).onSnapshot(snap=>{
      DB[t]=snap.docs.map(d=>({...d.data(),id:d.id}));
      if(t==='complaints') watchNewComplaints();
      if(t==='amc') watchNewConfirmations();
      scheduleSyncRender();
    }, err=>console.warn('sync '+t+':',err.message));
  });
  fdb.collection('meta').doc('settings').onSnapshot(d=>{ if(d.exists) DB.settings=mergeSettings(d.data()); });
}
function watchNewComplaints(){ if(!isStaff())return;
  const newest=Math.max(0,...store.all('complaints').map(c=>Date.parse(c._c)||0));
  if(newest>_seenComplaint){ const c=store.all('complaints').find(x=>Date.parse(x._c)===newest);
    _seenComplaint=newest; if(c) toast('🛠️ New '+(c.kind||'complaint').toLowerCase()+' '+c.code+(c.customerName?' — '+c.customerName:''),'info'); } }
function watchNewConfirmations(){ if(!isManager())return;
  const newest=Math.max(0,...store.all('amc').map(a=>Date.parse(a.custConfirmedAt)||0));
  if(newest>_seenConfirm){ const a=store.all('amc').find(x=>Date.parse(x.custConfirmedAt)===newest);
    _seenConfirm=newest; if(a){ const c=store.get('customers',a.customerId); toast('✅ AMC renewal confirmed by '+(c?c.name:'customer')+' ('+a.code+')','ok'); } } }
function scheduleSyncRender(){ clearTimeout(syncT); syncT=setTimeout(()=>{
  if(!session) return;
  if($('#modalBg').classList.contains('open')) return;                 // don't wipe an open form/modal
  const tag=document.activeElement&&document.activeElement.tagName;
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(tag||'')) return;                // don't interrupt typing
  buildNav(); refreshBell(); route();
},450); }

function enterApp(){
  $('#login').style.display='none'; $('#app').style.display='block';
  $('#uName').textContent=session.name; $('#uAv').textContent=(session.name||'?')[0].toUpperCase();
  const cust=isCustomer();
  $('#fab').style.display=cust?'none':'';                 // "New Visit" is staff-only
  buildNav(); if(!cust) runAlertScan(); refreshBell(); resetIdle();
  const home=cust?'#home':'#dashboard';
  if(!location.hash) location.hash=home; else route();
}
function wireLogin(){
  const go=async()=>{ const u=$('#lg-user').value,p=$('#lg-pass').value; $('#lg-err').textContent='';
    if(!u||!p){ $('#lg-err').textContent='Enter your email and password'; return; }
    $('#lg-btn').disabled=true; const r=await doLogin(u,p); $('#lg-btn').disabled=false;
    if(!r.ok) $('#lg-err').textContent=r.msg;        /* success handled by onAuthStateChanged */ };
  $('#lg-btn').onclick=go;
  ['lg-user','lg-pass'].forEach(id=>$('#'+id).addEventListener('keydown',e=>{if(e.key==='Enter')go();}));
  const fp=$('#lg-forgot'); if(fp) fp.onclick=e=>{ e.preventDefault(); const em=($('#lg-user').value||'').trim();
    if(!em){ $('#lg-err').textContent='Type your email above first, then tap "Forgot password?"'; return; } sendReset(em); };
}
function wireChrome(){
  $('#logoutBtn').onclick=logout;
  $('#menuBtn').onclick=()=>{$('#side').classList.toggle('open');$('#scrim').classList.toggle('open');};
  $('#scrim').onclick=()=>{$('#side').classList.remove('open');$('#scrim').classList.remove('open');};
  $('#fab').onclick=()=>VIEWS.visitForm&&VIEWS.visitForm();
  $('#bellBtn').onclick=()=>{const p=$('#notifPop');p.classList.toggle('open');if(p.classList.contains('open'))renderNotifPop();};
  $('#markAll').onclick=()=>{store.all('notifications').forEach(n=>{if(!n.read)store.update('notifications',n.id,{read:true});});refreshBell();renderNotifPop();};
  $('#modalBg').onclick=e=>{if(e.target.id==='modalBg')closeModal();};
  $('#globalSearch').addEventListener('input',debounce(e=>globalSearch(e.target.value),200));
  $('#globalSearch').addEventListener('keydown',e=>{if(e.key==='Enter'){location.hash='#customers?q='+encodeURIComponent(e.target.value);}});
  window.addEventListener('hashchange',route);
  window.addEventListener('online',()=>setNet(true)); window.addEventListener('offline',()=>setNet(false));
  setNet(navigator.onLine);
  ['click','keydown','touchstart'].forEach(ev=>document.addEventListener(ev,()=>{if(session)resetIdle();},{passive:true}));
}
function setNet(on){ const c=$('#netChip'); c.className='net '+(on?'on':'off'); $('#netTxt').textContent=on?'Online':'Offline · will sync when reconnected'; }
function globalSearch(q){ q=q.trim().toLowerCase(); if(!q){$('#notifPop').classList.remove('open');return;}
  const hits=[]; const add=(t,label,link)=>hits.push({t,label,link});
  store.all('customers').forEach(c=>{ if([c.name,c.code,c.mobile,c.company,c.city,c.contactPerson].join(' ').toLowerCase().includes(q)) add('Customer',c.name+' · '+c.code,'#c360/'+c.id); });
  store.all('amc').forEach(a=>{ const c=store.get('customers',a.customerId); if([a.code,a.serial,a.equipment].join(' ').toLowerCase().includes(q)) add('AMC',a.code+' · '+(c?c.name:''),'#c360/'+a.customerId); });
  store.all('inquiries').forEach(i=>{ if([i.code,i.description,i.category].join(' ').toLowerCase().includes(q)) add('Inquiry',i.code+' · '+i.category,'#inquiries?q='+encodeURIComponent(q)); });
  store.all('equipment').forEach(e=>{ if([e.serial,e.make,e.model].join(' ').toLowerCase().includes(q)&&e.serial) add('Equipment',(e.serial||e.make),'#c360/'+e.customerId); });
  const p=$('#notifPop'); p.classList.add('open'); const list=$('#notifList'); list.innerHTML='';
  $('.nh',p).firstChild.textContent='Search results ('+hits.length+') ';
  if(!hits.length){list.append(el('div',{class:'empty'},'No matches'));return;}
  hits.slice(0,25).forEach(h=>list.append(el('div',{class:'notif-item',onclick:()=>{location.hash=h.link;p.classList.remove('open');$('#globalSearch').value='';}},
    el('div',{class:'ic'},'🔎'),el('div',{},el('div',{html:'<b>'+esc(h.label)+'</b>'}),el('div',{class:'small'},h.t)))));
}

document.addEventListener('DOMContentLoaded',boot);
})();

</script>
<script>
/* ============================================================================
   VIEWS  — every screen. Depends on window.LCUtil + window.VIEWS from app_core
============================================================================ */
(function(){
'use strict';
const U=window.LCUtil, VIEWS=window.VIEWS;
const {$,$$,el,esc,uid,todayISO,nowISO,parseD,fmtD,fmtDT,daysUntil,addDaysISO,inr,toast,store,can,
  ROLES,amcStatus,amcSeverity,runAlertScan,refreshBell,pushNotif,sendEmail,sendWhatsApp,renewalPDF,
  fillTemplate,amcCtx,debounce,openModal,closeModal,route,navCounts}=U;
const session=U.session;
const S=()=>store.settings(); const M=()=>store.settings().masters;
let charts=[];

/* ---------- shared UI helpers ---------- */
function pageHead(title,sub,actions){ const h=el('div',{class:'page-head'},
  el('div',{},el('h2',{},title), sub?el('div',{class:'sub'},sub):'')); 
  if(actions){const a=el('div',{class:'actions'});actions.forEach(x=>x&&a.append(x));h.append(a);} return h; }
function badge(txt,cls){ return el('span',{class:'badge '+cls},txt); }
const STCLS={ 'New':'bg-info','Pending':'bg-warn','Quotation Required':'bg-warn','Quotation Submitted':'bg-brand',
  'Under Discussion':'bg-brand','Follow-up Required':'bg-warn','Won':'bg-ok','Lost':'bg-crit','Closed':'bg-mut',
  'Active':'bg-ok','Expiring Soon':'bg-warn','Expired':'bg-crit','Renewed':'bg-brand','Cancelled':'bg-mut',
  'Low':'bg-mut','Medium':'bg-info','High':'bg-hi','Urgent':'bg-crit','Open':'bg-info','Done':'bg-ok'};
function stBadge(s){ return badge(s||'—',STCLS[s]||'bg-mut'); }
function amcBadge(a){ const s=amcStatus(a); return badge(s,STCLS[s]||'bg-mut'); }

function selectEl(opts,val,attrs={}){ const s=el('select',attrs);
  if(attrs.placeholder!==undefined){s.append(el('option',{value:''},attrs.placeholder));}
  opts.forEach(o=>{const v=typeof o==='object'?o.v:o,t=typeof o==='object'?o.t:o;
    const op=el('option',{value:v},t); if(String(v)===String(val))op.selected=true; s.append(op);}); return s; }
function field(label,input,{req,hint,full}={}){ const w=el('div',{class:'field'+(full?' full':'')},
  el('label',{class:req?'req':''},label),input); if(hint)w.append(el('div',{class:'hint'},hint)); return w; }

/* generic sortable table. cols=[{key,label,render?,val?,cls?}], rows=[] */
function dataTable(cols,rows,{onRow,empty='No records'}={}){
  const wrap=el('div',{class:'tablewrap'}); if(!rows.length){wrap.append(el('div',{class:'empty'},
    el('div',{class:'ico'},'📭'),el('div',{},empty)));return wrap;}
  let sortKey=null,dir=1;
  const tbl=el('table',{class:'tbl'}); const thead=el('thead'); const tr=el('tr');
  cols.forEach(c=>{ const th=el('th',{onclick:()=>{ if(sortKey===c.key)dir*=-1; else{sortKey=c.key;dir=1;} draw(); }},
    c.label,' ',el('span',{class:'ar'},sortKey===c.key?(dir>0?'▲':'▼'):'')); tr.append(th); });
  thead.append(tr); tbl.append(thead); const tb=el('tbody'); tbl.append(tb);
  function draw(){ tb.innerHTML=''; let rs=[...rows];
    if(sortKey){ const c=cols.find(x=>x.key===sortKey); rs.sort((a,b)=>{ let va=c.val?c.val(a):a[sortKey],vb=c.val?c.val(b):b[sortKey];
      va=va==null?'':va; vb=vb==null?'':vb; if(!isNaN(va)&&!isNaN(vb)&&va!==''&&vb!==''){va=+va;vb=+vb;}
      return (va>vb?1:va<vb?-1:0)*dir; }); }
    rs.forEach(r=>{ const rowEl=el('tr',onRow?{class:'clk',onclick:()=>onRow(r)}:{});
      cols.forEach(c=>{ const td=el('td',{class:c.cls||''}); const v=c.render?c.render(r):(r[c.key]??'—');
        if(v&&v.nodeType)td.append(v); else td.innerHTML=v===''||v==null?'—':esc(String(v)); rowEl.append(td); });
      tb.append(rowEl); });
  } draw(); wrap.append(tbl); return wrap;
}

/* export helpers */
function exportData(name,rows,cols){
  const data=rows.map(r=>{const o={};cols.forEach(c=>o[c.label]=c.val?c.val(r):(r[c.key]??''));return o;});
  return {data,name};
}
function downloadCSV(name,data){ if(!data.length){toast('Nothing to export','warn');return;}
  const heads=Object.keys(data[0]); const csv=[heads.join(',')].concat(
    data.map(r=>heads.map(h=>{let v=r[h]==null?'':String(r[h]); if(/[",\n]/.test(v))v='"'+v.replace(/"/g,'""')+'"'; return v;}).join(','))).join('\n');
  const blob=new Blob([csv],{type:'text/csv'}); const a=el('a',{href:URL.createObjectURL(blob),download:name+'.csv'});
  document.body.append(a);a.click();a.remove(); toast('CSV exported','ok'); }
function downloadXLSX(name,data){ if(!data.length){toast('Nothing to export','warn');return;}
  const ws=XLSX.utils.json_to_sheet(data); const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,name.slice(0,28)); XLSX.writeFile(wb,name+'.xlsx'); toast('Excel exported','ok'); }
function exportBtns(name,getRows,cols){
  const mk=(label,fn)=>el('button',{class:'btn sm sec',onclick:()=>{const {data}=exportData(name,getRows(),cols);fn(name,data);}},label);
  const wrap=el('div',{style:'display:flex;gap:6px'});
  wrap.append(mk('⬇ CSV',downloadCSV),mk('⬇ Excel',downloadXLSX)); return wrap;
}

/* customer picker with autocomplete + inline "create new" */
function customerPicker(onSelect,preId){
  const box=el('div',{}); const inp=el('input',{placeholder:'Type name / phone / code…',autocomplete:'off',
    style:'width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px'});
  const drop=el('div',{style:'border:1px solid var(--line);border-radius:9px;margin-top:4px;max-height:210px;overflow:auto;display:none;box-shadow:var(--sh)'});

  if(preId){const c=store.get('customers',preId);if(c)pick(c);}
  inp.addEventListener('input',()=>{ const q=inp.value.trim().toLowerCase(); selected=null; onSelect(null);
    if(!q){drop.style.display='none';return;} const hits=store.all('customers').filter(c=>
      [c.name,c.mobile,c.code,c.company,c.contactPerson].join(' ').toLowerCase().includes(q)).slice(0,8);
    drop.innerHTML=''; drop.style.display='block';
    hits.forEach(c=>drop.append(el('div',{style:'padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer',
      onmouseover:function(){this.style.background='#f2f6fc';},onmouseout:function(){this.style.background='';},
      onclick:()=>pick(c)}, el('b',{},c.name),' ',el('span',{class:'small'},c.code+(c.mobile?(' · '+c.mobile):'')))));
    drop.append(el('div',{style:'padding:9px 12px;color:var(--brand2);cursor:pointer;font-weight:600',
      onclick:()=>{ closeModal(); openCustomerForm(null,(nc)=>{ VIEWS.visitForm(nc.id); }); }},'＋ Create new customer'));
  });
  box.append(inp,drop); return box;
}

/* ============================================================================
   DASHBOARD
============================================================================ */
VIEWS.dashboard=function(view){
  charts.forEach(c=>c.destroy&&c.destroy()); charts=[];
  const cust=store.all('customers'),amc=store.all('amc'),inq=store.all('inquiries'),
    vis=store.all('visits'),fu=store.all('followups');
  const amcBy=n=>amc.filter(a=>{const d=daysUntil(a.endDate);return a.manual!=='Cancelled'&&d!=null&&d>=0&&d<=n;});
  const expired=amc.filter(a=>{const d=daysUntil(a.endDate);return a.manual!=='Cancelled'&&d!=null&&d<0;});
  const renewed=amc.filter(a=>amcStatus(a)==='Renewed');
  const openInq=inq.filter(i=>!['Won','Lost','Closed'].includes(i.status));

  ]));
  const cards=[
    ['Total Customers',cust.length,'b-brand','#customers'],

    ['Renewed',renewed.length,'b-ok','#amc'],
    ['Total Inquiry',inq.length,'b-brand','#inquiries'],
    ['Open Inquiry',openInq.length,'b-info','#inquiries'],

  cards.forEach(([l,v,c,link])=>cg.append(el('div',{class:'stat '+c,onclick:()=>location.hash=link},

  // charts row
  const row=el('div',{class:'grid2'});
  const mkPanel=(title,canvasId)=>{const p=el('div',{class:'panel'},el('div',{class:'ph'},title),

  row.append(mkPanel('Inquiries by month','chMonth'),mkPanel('Inquiry conversion','chConv'),
    mkPanel('AMC expiry trend (next 6 months)','chAmc'),mkPanel('Employee-wise inquiries','chEmp'));

  // Today's follow-ups panel
  const fpanel=el('div',{class:'panel'},el('div',{class:'ph'},"Today's & overdue follow-ups",

    .sort((a,b)=>(a.nextDate||'').localeCompare(b.nextDate||''));

    {key:'nextDate',label:'Due',render:r=>{const d=daysUntil(r.nextDate);return d<0?badge('Overdue '+Math.abs(d)+'d','bg-crit'):badge('Today','bg-warn');}},
    {key:'remark',label:'Remark'},

  ],dueF,{onRow:r=>location.hash='#c360/'+r.customerId,empty:'No follow-ups due today 🎉'}));

};
function drawDashCharts(inq){
  const mColors=['#0f4c81','#1769aa','#2f6fbf','#7fb2e6','#c8dcf3'];
  // by month
  const bm={}; inq.forEach(i=>{const m=(i.date||'').slice(0,7);if(m)bm[m]=(bm[m]||0)+1;});
  const mk=Object.keys(bm).sort();
  charts.push(new Chart($('#chMonth'),{type:'bar',data:{labels:mk.map(m=>m),
    datasets:[{label:'Inquiries',data:mk.map(m=>bm[m]),backgroundColor:'#1769aa',borderRadius:5}]},
    options:{plugins:{legend:{display:false}},maintainAspectRatio:false,scales:{y:{beginAtZero:true,ticks:{precision:0}}}}}));
  // conversion
  const won=inq.filter(i=>i.status==='Won').length,lost=inq.filter(i=>i.status==='Lost').length,
    open=inq.length-won-lost;
  charts.push(new Chart($('#chConv'),{type:'doughnut',data:{labels:['Won','Lost','Open/In-progress'],
    datasets:[{data:[won,lost,open],backgroundColor:['#1a9d5a','#d13c3c','#c8860a']}]},
    options:{maintainAspectRatio:false,plugins:{legend:{position:'bottom'}}}}));
  // AMC expiry trend next 6 months
  const amc=store.all('amc'); const buckets={}; const now=new Date();
  for(let k=0;k<6;k++){const d=new Date(now.getFullYear(),now.getMonth()+k,1);buckets[d.toISOString().slice(0,7)]=0;}
  amc.forEach(a=>{const m=(a.endDate||'').slice(0,7);if(m in buckets)buckets[m]++;});
  const bk=Object.keys(buckets);
  charts.push(new Chart($('#chAmc'),{type:'line',data:{labels:bk,
    datasets:[{label:'AMCs expiring',data:bk.map(m=>buckets[m]),borderColor:'#d13c3c',backgroundColor:'rgba(209,60,60,.12)',fill:true,tension:.3}]},
    options:{maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{precision:0}}}}}));
  // employee-wise
  const be={}; inq.forEach(i=>{const e=i.assigned||'Unassigned';be[e]=(be[e]||0)+1;});
  const ek=Object.keys(be);
  charts.push(new Chart($('#chEmp'),{type:'bar',data:{labels:ek,
    datasets:[{label:'Inquiries',data:ek.map(e=>be[e]),backgroundColor:'#2f6fbf',borderRadius:5}]},
    options:{indexAxis:'y',maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{beginAtZero:true,ticks:{precision:0}}}}}));
}

  let q=params.get('q')||'';
  const head=pageHead('Customers',store.all('customers').length+' records',[

  // photo + gps
  const photoInp=el('input',{type:'file',accept:'image/*',capture:'environment'});
  let photoData=''; photoInp.addEventListener('change',()=>{const file=photoInp.files[0];if(!file)return;
    const r=new FileReader();
    r.onload=()=>{ const img=new Image();
      img.onload=()=>{ try{
          const max=1024; let w=img.width||max, h=img.height||max;        // downscale: longest side ≤ 1024px
          if(w>=h && w>max){ h=Math.round(h*max/w); w=max; } else if(h>w && h>max){ w=Math.round(w*max/h); h=max; }
          const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
          const ctx=cv.getContext('2d'); if(!ctx){ photoData=r.result; toast('Photo attached','ok'); return; }
          ctx.drawImage(img,0,0,w,h);
          photoData=cv.toDataURL('image/jpeg',0.7);                        // compress → keeps doc well under Firestore's 1MB limit
          toast('Photo attached ('+Math.round(photoData.length/1024)+' KB)','ok');
        }catch(e){ photoData=r.result; toast('Photo attached','ok'); } };
      img.onerror=()=>toast('Could not read that image','err');
      img.src=r.result; };

  // inquiry toggle

    el('span',{},'Also create an Inquiry from this visit')));

  const save=el('button',{class:'btn',onclick:()=>{

    refreshEquip();
    const v={};Object.keys(f).forEach(k=>v[k]=f[k].value);
    v.customerId=selCust.id; v.photo=photoData; v.lat=lat; v.lng=lng; v.code=store.code('VIS');
    const visit=store.insert('visits',v);
    store.update('customers',selCust.id,{lastVisit:v.date});
    // follow-up
    if(v.nextFollowup){ store.insert('followups',{customerId:selCust.id,visitId:visit.id,date:v.date,
      nextDate:v.nextFollowup,remark:v.requirement||v.purpose,status:'Open',by:v.employee}); }
    // inquiry
    if(inqChk.checked&&(v.requirement||v.inquiryType)){
      const inq=store.insert('inquiries',{code:store.code('INQ'),customerId:selCust.id,visitId:visit.id,
        date:v.date,product:'',category:v.inquiryType||'AMC',description:v.requirement||'',value:v.value||'',
        quotationReq:'No',quotationNo:'',status:'New',priority:v.priority,assigned:v.employee,
        nextFollowup:v.nextFollowup||'',lastFollowup:v.date,remarks:v.remarks||'',createdBy:v.employee});
      if(v.nextFollowup){store.all('followups').filter(x=>x.visitId===visit.id).forEach(x=>store.update('followups',x.id,{inquiryId:inq.id}));}
    }
    toast('Visit saved to central database','ok'); closeModal(); buildNavSafe(); location.hash='#c360/'+selCust.id;
  }},'💾 Save Visit');
  openModal('New Customer Visit',body,[el('button',{class:'btn sec',onclick:closeModal},'Cancel'),save],true);
  // re-render equipment options when picker selects (customerPicker calls onSelect)
  const obs=setInterval(()=>{ if(!$('#modalBg').classList.contains('open')){clearInterval(obs);return;} refreshEquip(); },800);
};

VIEWS.reports=function(view){
  view.append(pageHead('Reports','Filtered operational & management reports'));
  const defs=[
    ['Customer Visit Report','visits',VIS_COLS],
    ['Daily Inquiry Report','inquiries',INQ_COLS],
    ['Employee-wise Inquiry Report','inquiries',INQ_COLS],
    ['Pending Inquiry Report','inquiries',INQ_COLS],
    ['Follow-up Due Report','followups',FU_COLS],
    ['AMC Expiry Report','amc',AMC_COLS],
    ['AMC Overdue Report','amc',AMC_COLS],
    ['Customer Master Report','customers',CUST_COLS],
  ];
  const bar=el('div',{class:'panel'}); const pb=el('div',{class:'pb filters'});
  const rSel=selectEl(defs.map((d,i)=>({v:i,t:d[0]})),0);
  const d1=el('input',{type:'date'}),d2=el('input',{type:'date'});
  const empF=selectEl([...new Set(store.all('users').map(u=>u.name))],'',{placeholder:'All employees'});
  const stF=el('input',{placeholder:'Status contains…'});
  pb.append(field('Report',rSel),field('From',d1),field('To',d2),field('Employee',empF),field('Status',stF));
  bar.append(pb); view.append(bar);
  const out=el('div',{class:'panel'}); view.append(out);
  function build(){ const [title,table,cols]=defs[+rSel.value]; let rows=[...store.all(table)];
    // report-specific base filters
    if(title==='Pending Inquiry Report')rows=rows.filter(r=>!['Won','Lost','Closed'].includes(r.status));
    if(title==='Follow-up Due Report')rows=rows.filter(r=>r.status==='Open'&&r.nextDate&&daysUntil(r.nextDate)<=7);
    if(title==='AMC Expiry Report')rows=rows.filter(r=>{const d=daysUntil(r.endDate);return d!=null&&d>=0&&d<=90;});
    if(title==='AMC Overdue Report')rows=rows.filter(r=>{const d=daysUntil(r.endDate);return d!=null&&d<0&&r.manual!=='Cancelled';});
    // generic filters
    const dateKey=table==='followups'?'nextDate':table==='amc'?'endDate':'date';
    rows=rows.filter(r=>{ if(d1.value&&(r[dateKey]||'')<d1.value)return false; if(d2.value&&(r[dateKey]||'')>d2.value)return false;
      if(empF.value&&!(r.employee===empF.value||r.assigned===empF.value||r.by===empF.value))return false;
      if(stF.value&&!(String(r.status||'').toLowerCase().includes(stF.value.toLowerCase())))return false; return true;});
    out.innerHTML='';
    out.append(el('div',{class:'ph'},title+' ('+rows.length+')',el('div',{class:'actions'},
      exportBtns(title.replace(/\W+/g,'_'),()=>rows,cols),
      el('button',{class:'btn sm sec',onclick:()=>reportPDF(title,rows,cols)},'⬇ PDF'))));
    out.append(dataTable(cols.map(c=>({key:c.key,label:c.label,val:c.val,
      render:r=>{const v=c.val?c.val(r):r[c.key]; if(['date','endDate','startDate','nextDate','created','lastVisit'].includes(c.key))return fmtD(v);return v||'—';}})),
      rows.slice(0,300),{empty:'No matching records'}));
  }
  [rSel,d1,d2,empF,stF].forEach(i=>i.addEventListener('input',build)); build();
};
function reportPDF(title,rows,cols){ const {jsPDF}=window.jspdf; const doc=new jsPDF({orientation:'landscape'});
  const s=store.settings().company; doc.setFontSize(14);doc.setFont(undefined,'bold');doc.text(s.name,14,14);
  doc.setFontSize(11);doc.text(title,14,21); doc.setFontSize(8);doc.setFont(undefined,'normal');
  doc.text('Generated '+fmtDT(nowISO())+'  ·  '+rows.length+' records',14,26);
  const use=cols.slice(0,7); let y=34; const cw=270/use.length;
  doc.setFont(undefined,'bold'); use.forEach((c,i)=>doc.text(String(c.label).slice(0,18),14+i*cw,y)); doc.setFont(undefined,'normal');
  y+=5; doc.setDrawColor(220);doc.line(14,y-3,284,y-3);
  rows.slice(0,40).forEach(r=>{ use.forEach((c,i)=>{let v=c.val?c.val(r):r[c.key];
      if(['date','endDate','startDate','nextDate','created'].includes(c.key))v=fmtD(v); doc.text(String(v??'').slice(0,20),14+i*cw,y);});
    y+=6; if(y>195){doc.addPage();y=20;} });
  if(rows.length>40)doc.text('… '+(rows.length-40)+' more rows (use Excel export for full data)',14,y+4);
  doc.save(title.replace(/\W+/g,'_')+'.pdf'); toast('PDF exported','ok');
}

VIEWS.import=function(view){
  if(!(session().role==='admin')){view.append(el('div',{class:'empty'},'Admin only'));return;}
  view.append(pageHead('Excel Import','Bring your existing sheets into the cloud database — with duplicate detection'));
  // Built-in dataset loader (the original July-2026 inquiry sheet, 61 records)
  const bi=el('div',{class:'panel'}); bi.append(el('div',{class:'ph'},'Quick start · built-in July-2026 records'));
  const bib=el('div',{class:'pb'});
  bib.append(el('p',{class:'small'},'Load the 61 records from the original July-2026 inquiry sheet straight into Firestore (customers, equipment, visits, inquiries, follow-ups and the 7 known AMC dates). Use this once to get started, then keep adding via Excel upload or the New Visit button.'));
  bib.append(el('button',{class:'btn',onclick:()=>{
      if(store.all('customers').length && !confirm('Your database already has '+store.all('customers').length+' customers. Load the built-in records on top of them?')) return;
      const n=U.loadBuiltinData(); refreshBell(); buildNavSafe();
      toast(n+' customers loaded from built-in sheet','ok'); route();
    }},'⬇ Load built-in July-2026 records'));
  bi.append(bib); view.append(bi);

  const p=el('div',{class:'panel'}); const pb=el('div',{class:'pb'});
  pb.append(el('p',{class:'small'},'Upload an .xlsx / .csv. You will map each column to a database field, preview, and import only valid, non-duplicate customers.'));
  const fileInp=el('input',{type:'file',accept:'.xlsx,.xls,.csv'});
  pb.append(field('Choose file',fileInp));
  const area=el('div',{}); p.append(el('div',{class:'ph'},'1 · Upload'),pb,area); view.append(p);
  const FIELDS=[['','— ignore —'],['name','Customer / Site Name'],['company','Company'],['contactPerson','Contact Person'],
    ['mobile','Mobile'],['email','Email'],['address','Address'],['city','City'],['make','Elevator Make (→equipment)'],
    ['floors','Floors (→equipment)'],['amc_end','AMC End Date (→AMC)'],['remarks','Remarks / Inquiry (→inquiry)']];
  fileInp.addEventListener('change',()=>{ const file=fileInp.files[0]; if(!file)return;
    const rd=new FileReader(); rd.onload=e=>{ let wb; try{wb=XLSX.read(e.target.result,{type:'binary',cellDates:true});}catch(err){toast('Could not read file','err');return;}
      const ws=wb.Sheets[wb.SheetNames[0]]; const json=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
      // find header row = first row with >=3 non-empty cells
      let hi=json.findIndex(r=>r.filter(x=>String(x).trim()).length>=3); if(hi<0)hi=0;
      const headers=json[hi].map(h=>String(h).trim()); const dataRows=json.slice(hi+1).filter(r=>r.some(x=>String(x).trim()));
      renderMap(headers,dataRows);
    }; rd.readAsBinaryString(file); });
  function guess(h){ h=h.toLowerCase(); if(/site|customer|name/.test(h))return 'name'; if(/company/.test(h))return 'company';
    if(/con.?per|person/.test(h))return 'contactPerson'; if(/mobile|contact|phone/.test(h))return 'mobile';
    if(/mail/.test(h))return 'email'; if(/address/.test(h))return 'address'; if(/city/.test(h))return 'city';
    if(/make|elevator|brand/.test(h))return 'make'; if(/floor/.test(h))return 'floors';
    if(/amc|expiry|end|follow/.test(h))return 'amc_end'; if(/remark/.test(h))return 'remarks'; return ''; }
  function renderMap(headers,rows){ area.innerHTML=''; const mapSel=[];
    area.append(el('div',{class:'ph',style:'margin-top:10px;border-top:1px solid var(--line)'},'2 · Map columns ('+rows.length+' rows found)'));
    const mg=el('div',{class:'pb',style:'display:grid;grid-template-columns:1fr 1fr;gap:8px'});
    headers.forEach((h,idx)=>{ const sel=selectEl(FIELDS.map(f=>({v:f[0],t:f[1]})),guess(h)); mapSel[idx]=sel;
      mg.append(el('div',{class:'chip',style:'justify-content:space-between'},el('b',{},h||('Col '+(idx+1))),sel)); });
    area.append(mg);
    const btn=el('button',{class:'btn',style:'margin:0 16px 16px',onclick:()=>preview(headers,rows,mapSel)},'Preview & validate →');
    area.append(btn);
  }
  function preview(headers,rows,mapSel){ const map={}; mapSel.forEach((s,i)=>{if(s.value)map[s.value]=i;});
    if(map.name==null){toast('Map at least the Customer Name column','err');return;}
    const existing=store.all('customers');
    const parsed=rows.map(r=>{ const o={}; Object.keys(map).forEach(k=>o[k]=String(r[map[k]]??'').trim());
      // date parse for amc_end
      if(o.amc_end){const m=o.amc_end.match(/(\d{1,2})[-/](\d{1,2})[-/](\d{4})/);if(m){o.amc_end=`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;}else if(!/^\d{4}-\d{2}-\d{2}/.test(o.amc_end))o.amc_end='';}
      o._dup=existing.some(c=>c.name.toLowerCase()===(o.name||'').toLowerCase()&&(!o.mobile||c.mobile===o.mobile));
      o._err=!o.name?'Missing name':''; return o; });
    const valid=parsed.filter(p=>!p._err&&!p._dup); const dups=parsed.filter(p=>p._dup); const errs=parsed.filter(p=>p._err);
    const sect=el('div',{}); sect.append(el('div',{class:'ph',style:'border-top:1px solid var(--line)'},'3 · Preview'));
    const cg=el('div',{class:'cards',style:'padding:0 16px'});
    cg.append(el('div',{class:'stat b-ok'},el('div',{class:'lbl'},'Will import'),el('div',{class:'val'},valid.length)),
      el('div',{class:'stat b-warn'},el('div',{class:'lbl'},'Duplicates (skip)'),el('div',{class:'val'},dups.length)),
      el('div',{class:'stat b-crit'},el('div',{class:'lbl'},'Errors'),el('div',{class:'val'},errs.length)));
    sect.append(cg);
    const cols=Object.keys(map).map(k=>({key:k,label:k})); cols.unshift({key:'_flag',label:'Status',render:r=>r._err?badge('Error','bg-crit'):r._dup?badge('Duplicate','bg-warn'):badge('New','bg-ok')});
    sect.append(dataTable(cols,parsed.slice(0,80),{empty:'Nothing parsed'}));
    const imp=el('button',{class:'btn',style:'margin:12px 16px',onclick:()=>{
      let n=0; valid.forEach(o=>{ const cust=store.insert('customers',{code:store.code('CUST'),name:o.name,company:o.company||o.name,
        contactPerson:o.contactPerson||'',mobile:o.mobile||'',email:o.email||'',address:o.address||'',city:o.city||'',
        state:'',type:'Society / Apartment',segment:'Elevator',assigned:session().name,status:'Active',
        remarks:o.remarks||'',created:todayISO(),lastVisit:''});
        if(o.make||o.floors){const eq=store.insert('equipment',{code:store.code('EQP'),customerId:cust.id,type:'Passenger Elevator',
          make:o.make||'Not Recorded',model:'',serial:'',floors:o.floors||'',newLift:false,status:'Operational',remarks:''});
          if(o.amc_end)store.insert('amc',{code:store.code('AMC'),customerId:cust.id,equipmentId:eq.id,equipment:'Passenger Elevator',
            serial:'',startDate:addDaysISO(o.amc_end,-365),endDate:o.amc_end,value:'',type:'Comprehensive',freq:'Quarterly',
            assigned:session().name,manual:'',remarks:'Imported'});}
        if(o.remarks)store.insert('inquiries',{code:store.code('INQ'),customerId:cust.id,visitId:'',date:todayISO(),
          product:'',category:'AMC',description:o.remarks,value:'',quotationReq:'No',status:'New',priority:'Medium',
          assigned:session().name,nextFollowup:o.amc_end||'',remarks:'',createdBy:session().name});
        n++; });
      runAlertScan();refreshBell();buildNavSafe();
      toast(n+' customers imported','ok');
      sect.append(el('div',{class:'pb'},el('div',{class:'stat b-ok',style:'max-width:340px'},
        el('div',{class:'lbl'},'Import summary'),el('div',{},n+' imported · '+dups.length+' duplicates skipped · '+errs.length+' errors'))));
      imp.disabled=true;
    }},'✓ Import '+valid.length+' valid records');
    sect.append(imp); area.querySelectorAll('.import-preview').forEach(x=>x.remove()); sect.className='import-preview'; area.append(sect);
  }
};

/* Attachment picker — compresses images in-browser, accepts small PDFs, caps total size
   so the complaint document stays under Firestore's 1 MB limit. */
function attachmentPicker(){
  const wrap=el('div',{}); const list=[];
  const listEl=el('div',{class:'small',style:'margin:6px 0'});
  function redraw(){ listEl.innerHTML=''; if(!list.length){listEl.append(el('span',{style:'color:var(--muted)'},'No files attached'));return;}
    list.forEach((a,i)=>listEl.append(el('div',{style:'display:flex;gap:8px;align-items:center;margin:2px 0'},
      el('span',{},(a.type==='image'?'🖼 ':'📎 ')+a.name+' ('+Math.round(a.data.length/1024)+' KB)'),
      el('button',{class:'btn xs sec',onclick:()=>{list.splice(i,1);redraw();}},'Remove')))); }
  const inp=el('input',{type:'file',accept:'image/*,application/pdf',multiple:true});
  inp.addEventListener('change',()=>{ const files=[...inp.files]; inp.value='';
    files.forEach(file=>{ if(list.length>=4){toast('Up to 4 files','warn');return;}
      const r=new FileReader();
      if(file.type&&file.type.indexOf('image/')===0){
        r.onload=()=>{ const img=new Image(); img.onload=()=>{ try{
            const max=1024; let w=img.width||max,h=img.height||max;
            if(w>=h&&w>max){h=Math.round(h*max/w);w=max;}else if(h>w&&h>max){w=Math.round(w*max/h);h=max;}
            const cv=document.createElement('canvas');cv.width=w;cv.height=h;const ctx=cv.getContext('2d');
            const data=ctx?(ctx.drawImage(img,0,0,w,h),cv.toDataURL('image/jpeg',0.7)):r.result;
            list.push({name:file.name,type:'image',data});redraw();
          }catch(e){ list.push({name:file.name,type:'image',data:r.result});redraw(); } };
          img.onerror=()=>toast('Could not read that image','err'); img.src=r.result; };
        r.readAsDataURL(file);
      } else if(file.type==='application/pdf'){
        r.onload=()=>{ if(r.result.length>750*1024){toast(file.name+' is too large (keep PDFs under ~550 KB)','err');return;}
          list.push({name:file.name,type:'pdf',data:r.result});redraw(); };
        r.readAsDataURL(file);
      } else toast('Only images or PDF files','warn');
    }); });
  wrap.append(inp,listEl); redraw(); wrap.getData=()=>list.slice(); return wrap;
}

function deleteCustomerCascade(c){
  ['equipment','visits','inquiries','followups','amc','complaints','contacts'].forEach(t=>{

    save.disabled=true; save.textContent='Creating…';
    try{ await U.adminCreateUser({name:cust.name,email:f.email.value,pass:f.pass.value,role:'customer',customerId:cust.id});
      toast('Portal login created for '+cust.name,'ok'); closeModal(); route(); }
    catch(e){ save.disabled=false; save.textContent='Create login'; toast(e.message||'Could not create login','err'); }
  }},'Create login');
  openModal('Create portal login — '+cust.name,g,[el('button',{class:'btn sec',onclick:closeModal},'Cancel'),save]);
  openModalNote(g,'Share the email and temporary password with the customer. They sign in at the same web address and see only their own complaints and AMCs.');
}

})();

</script>
</body>
</html>
